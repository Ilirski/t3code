# Fork only: builds an unsigned Windows installer from this branch and keeps it as a run artifact.
#
#   gh workflow run fork-desktop-windows.yml --ref stable -f version=0.1.10
#   gh run download <run-id> -n t3code-windows-x64
name: Fork Windows installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version to stamp. Match the upstream stable tag this branch is based on."
        type: string
        default: "0.1.10"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64 installer
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      - name: Add Rust target
        run: rustup target add x86_64-pc-windows-msvc

      # The artifact build's preflight requires MSVC's Spectre-mitigated libraries.
      - name: Ensure Spectre-mitigated libraries
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $toolset = Get-ChildItem (Join-Path $install 'VC\Tools\MSVC') -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (Test-Path (Join-Path $toolset.FullName 'lib\spectre\x64')) { "Spectre libraries present"; exit 0 }
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vs_installer.exe'
          $process = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$install`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.Runtimes.x86.x64.Spectre',
            '--quiet', '--norestart', '--nocache'
          )
          if ($process.ExitCode -notin 0, 3010) { throw "vs_installer exited with $($process.ExitCode)" }

      - name: Install
        run: vp install

      # The public T3 Connect identifiers that official builds embed; see docs/operations/connect-setup.md.
      - name: Configure T3 Connect
        shell: pwsh
        run: Copy-Item .env.example .env

      - name: Build installer
        env:
          DESKTOP_VERSION: ${{ inputs.version }}
        run: vp run dist:desktop:win --build-version "$env:DESKTOP_VERSION"

      - name: List packaged files
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem release -Directory -ErrorAction SilentlyContinue | ForEach-Object {
            "== $($_.FullName)"
            Get-ChildItem $_.FullName -Recurse -File | ForEach-Object { $_.FullName.Substring($PWD.Path.Length + 1) }
          }

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14
