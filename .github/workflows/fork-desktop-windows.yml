# Fork only: builds an unsigned Windows x64 installer on every push to `stable` (including the
# upstream syncs from fork-upstream-sync.yml) and keeps it as a run artifact.
# Like upstream's release-desktop.yml, it cross-builds on Linux: native Windows hosts install extra
# optional natives and fail the packaged payload file limit. The installer embeds a Linux CLI archive
# as its WSL runtime, as official installers do.
#
#   gh workflow run fork-desktop-windows.yml --ref stable
#   gh run download <run-id> -n t3code-windows-x64
name: Fork Windows installer

on:
  push:
    branches: [stable]
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop version to stamp. Empty uses the upstream release this branch is based on."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fork-desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github

      - name: Find the newest upstream release in this branch
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          version="$REQUESTED"
          if test -z "$version"; then
            # An annotated tag lists its tag object and its commit; only the commit is in this history.
            version="$(git ls-remote --tags https://github.com/pingdotgg/t3code.git 'v*' |
              sed -nE 's#^([0-9a-f]+)\trefs/tags/v([0-9]+\.[0-9]+\.[0-9]+)(\^\{\})?$#\2 \1#p' |
              sort -rV -k1,1 |
              while read -r candidate sha; do
                if git merge-base --is-ancestor "$sha" HEAD 2>/dev/null; then echo "$candidate"; break; fi
              done)"
          fi
          test -n "$version" || { echo "::error::No upstream release found in this branch."; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  wsl_runtime:
    name: Build Linux x64 CLI archive
    needs: [version]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BUILD_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          run-install: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config patchelf libatomic1 build-essential python3

      - name: Install
        run: vp install

      - name: Load public T3 Connect config
        run: grep -E '^T3CODE_(CLERK_PUBLISHABLE_KEY|CLERK_JWT_TEMPLATE|CLERK_CLI_OAUTH_CLIENT_ID|RELAY_URL)=' .env.example >> "$GITHUB_ENV"

      - name: Align package versions and build bundle
        run: |
          node scripts/update-release-package-versions.ts "$BUILD_VERSION"
          vp run build:desktop
          node scripts/apply-web-brand-assets.ts production apps/server/dist/client

      - name: Build resource monitor
        run: |
          rustup target add x86_64-unknown-linux-gnu
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-unknown-linux-gnu
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-x64"
          cp native/resource-monitor/target/x86_64-unknown-linux-gnu/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/linux-x64/"

      - name: Build CLI archive
        run: |
          node apps/server/scripts/cli.ts build-exe
          node scripts/build-cli-archive.ts --platform linux --arch x64 --version "$BUILD_VERSION" --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli

      - name: Smoke-test CLI archive
        run: node scripts/smoke-cli-archive.ts --archive "release-cli/t3-$BUILD_VERSION-linux-x64.tar.gz" --expect-version "$BUILD_VERSION"

      - name: Upload CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-cli-linux-x64
          path: release-cli/t3-${{ needs.version.outputs.version }}-linux-x64.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Build Windows x64 installer
    needs: [version, wsl_runtime]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      BUILD_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        with:
          node-version-file: package.json
          run-install: false

      # The JS build compiles the Linux browser import helper, as release.yml's build_bundle does.
      - name: Install libsecret headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Install
        run: vp install

      - name: Load public T3 Connect config
        run: grep -E '^T3CODE_(CLERK_PUBLISHABLE_KEY|CLERK_JWT_TEMPLATE|CLERK_CLI_OAUTH_CLIENT_ID|RELAY_URL)=' .env.example >> "$GITHUB_ENV"

      - name: Install cargo-xwin
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-xwin@0.23.1

      - name: Build resource monitor
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Download Linux CLI archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: t3code-cli-linux-x64
          path: wsl-runtime

      - name: Build installer
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: true
        run: |
          node scripts/build-desktop-artifact.ts --platform win --target nsis --arch x64 --build-version "$BUILD_VERSION" --wsl-runtime "wsl-runtime/t3-$BUILD_VERSION-linux-x64.tar.gz" --verbose
          test -f "release/T3-Code-$BUILD_VERSION-x64.exe"

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: t3code-windows-x64
          path: |
            release/*.exe
            release/*.exe.blockmap
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
