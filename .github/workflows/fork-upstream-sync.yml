# Fork only: merges each new upstream release into `stable`. A clean merge that passes the checks is
# pushed to `stable`. A conflict or failing check goes to Claude Code; when its fix passes the same
# checks it opens a PR into `stable`, otherwise the run opens an issue. Merging, never rebasing, keeps
# `stable` moving forward only, so the PR's Merge button is always right. Pushes to `stable` start
# fork-desktop-windows.yml.
#
# Secrets: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token`. FORK_SYNC_TOKEN, a fine-grained token
# for this repository with Contents, Workflows, Pull requests and Issues set to read and write:
# GITHUB_TOKEN cannot push the workflow files upstream releases change.
#
#   gh workflow run fork-upstream-sync.yml              # newest upstream release
#   gh workflow run fork-upstream-sync.yml -f tag=v0.1.12
name: Fork upstream sync

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream release tag to merge. Empty picks the newest release."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Ilirski/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
      UPSTREAM: pingdotgg/t3code
    steps:
      - name: Require secrets
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || { echo "::error::Set the FORK_SYNC_TOKEN secret."; exit 1; }
          test -n "$CLAUDE_CODE_OAUTH_TOKEN" || { echo "::error::Set the CLAUDE_CODE_OAUTH_TOKEN secret."; exit 1; }

      - name: Checkout stable
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: stable
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Find the upstream release
        id: target
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="${REQUESTED_TAG:-$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName)}"
          git fetch --no-tags "https://github.com/$UPSTREAM.git" "+refs/tags/$tag:refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "stable already contains $tag."
            echo "action=none" >> "$GITHUB_OUTPUT"
          elif test -n "$(gh pr list --head "sync/$tag" --state open --json number --jq '.[].number')" ||
            test -n "$(gh issue list --state open --search "\"Upstream sync to $tag\" in:title" --json number --jq '.[].number')"; then
            echo "An open PR or issue already covers $tag."
            echo "action=none" >> "$GITHUB_OUTPUT"
          else
            echo "action=sync" >> "$GITHUB_OUTPUT"
          fi

      # Before the merge, which can leave conflict markers in the package.json this reads.
      - name: Setup Vite+
        if: steps.target.outputs.action == 'sync'
        uses: ./.github/actions/setup-ci-deps
        with:
          install: "false"

      - name: Merge the release
        id: merge
        if: steps.target.outputs.action == 'sync'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge --no-edit -m "chore(fork): merge upstream $TAG" "$TAG" > "$RUNNER_TEMP/merge.log" 2>&1; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/merge.log"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tools
        if: steps.target.outputs.action == 'sync'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev pkg-config
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the merge
        id: check
        if: steps.target.outputs.action == 'sync' && steps.merge.outputs.conflict == 'false'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -o pipefail
          if {
            vp install &&
              vp run --filter @t3tools/desktop ensure:electron &&
              node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium &&
              vp run i18n:check && vp run check:changed "$TAG"
          } 2>&1 | tee "$RUNNER_TEMP/check.log"; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the clean merge
        if: steps.check.outputs.passed == 'true'
        run: git push origin HEAD:stable

      - name: Ask Claude to fix it
        id: claude
        if: steps.target.outputs.action == 'sync' && steps.check.outputs.passed != 'true'
        timeout-minutes: 100
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TAG: ${{ steps.target.outputs.tag }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
        run: |
          if test "$CONFLICT" = true; then
            problem="The merge stopped on conflicts:"$'\n'"$(cat "$RUNNER_TEMP/merge.log")"
          else
            problem="The merge applied cleanly, but the checks failed. The end of their output:"$'\n'"$(tail -n 200 "$RUNNER_TEMP/check.log")"
          fi
          cat > "$RUNNER_TEMP/prompt.md" <<EOF
          This is Ilirski/t3code, a fork of $UPSTREAM. Its \`stable\` branch is upstream releases plus
          the fork's own commits (the annotator, fork CI and fork build scripts). Upstream $TAG is being
          merged into it. These are the fork's own commits:

          $(git log --oneline --no-merges "$TAG..HEAD")

          $problem

          Make the merge land with both upstream's changes and the fork's behaviour intact:

          1. If the merge is in progress, resolve each conflict so both sides survive, \`git add\` the
             files and finish with \`git commit --no-edit\`. Never abort the merge or drop either side.
          2. Run \`vp install\`, then make \`vp run i18n:check\` and \`vp run check:changed $TAG\` pass.
             Follow AGENTS.md; for example, new UI text goes through i18n and is translated in every
             locale. Browser tests need \`node apps/web/node_modules/playwright/cli.js install
             --with-deps --only-shell chromium\` first.
          3. Commit fixes as new conventional commits on top, such as \`fix(web): ...\`.
          4. Change only what the update requires. Do not push, change remotes, rewrite history, or
             edit .github/workflows/fork-*.yml.
          5. End with a short plain summary of what you changed and why. It becomes the PR description.
             If you cannot make the checks pass, say exactly what blocks you.
          EOF
          claude -p "$(cat "$RUNNER_TEMP/prompt.md")" --dangerously-skip-permissions > "$RUNNER_TEMP/claude.md" || true
          cat "$RUNNER_TEMP/claude.md"

      - name: Verify Claude's fix
        id: verify
        if: steps.claude.outcome == 'success'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          set -o pipefail
          ok=true
          if git rev-parse -q --verify MERGE_HEAD > /dev/null; then
            echo "The merge is still in progress." | tee "$RUNNER_TEMP/verify.log"; ok=false
          elif ! git merge-base --is-ancestor "$TAG" HEAD || ! git merge-base --is-ancestor origin/stable HEAD; then
            echo "HEAD must contain both $TAG and origin/stable." | tee "$RUNNER_TEMP/verify.log"; ok=false
          elif test -n "$(git status --porcelain)"; then
            git status --short | tee "$RUNNER_TEMP/verify.log"; ok=false
          elif ! {
            vp install &&
              node apps/web/node_modules/playwright/cli.js install --with-deps --only-shell chromium &&
              vp run i18n:check && vp run check:changed "$TAG"
          } 2>&1 | tee "$RUNNER_TEMP/verify.log"; then
            ok=false
          fi
          echo "passed=$ok" >> "$GITHUB_OUTPUT"

      - name: Open a PR with Claude's fix
        if: steps.verify.outputs.passed == 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          git push --force origin "HEAD:refs/heads/sync/$TAG"
          {
            echo "Merges upstream [$TAG](https://github.com/$UPSTREAM/releases/tag/$TAG) into \`stable\`. It needed fixes, which Claude Code made below; the checks pass. Merge it when you are happy."
            echo
            cat "$RUNNER_TEMP/claude.md"
            echo
            echo "🤖 Generated with [Claude Code](https://claude.com/claude-code)"
          } > "$RUNNER_TEMP/pr.md"
          gh pr create --base stable --head "sync/$TAG" --title "chore(fork): update to upstream $TAG" --body-file "$RUNNER_TEMP/pr.md"

      - name: Open an issue when it could not be fixed
        if: always() && steps.target.outputs.action == 'sync' && steps.check.outputs.passed != 'true' && steps.verify.outputs.passed != 'true'
        env:
          TAG: ${{ steps.target.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Merging upstream $TAG into \`stable\` needs a human; \`stable\` is unchanged. [Workflow run]($RUN_URL)."
            echo
            echo "## Claude's summary"
            echo
            cat "$RUNNER_TEMP/claude.md" 2>/dev/null || echo "Claude did not run."
            echo
            echo "## Last check output"
            echo
            echo '```'
            tail -n 80 "$RUNNER_TEMP/verify.log" 2>/dev/null || tail -n 80 "$RUNNER_TEMP/check.log" 2>/dev/null || cat "$RUNNER_TEMP/merge.log"
            echo '```'
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "Upstream sync to $TAG needs help" --body-file "$RUNNER_TEMP/issue.md"
          exit 1
